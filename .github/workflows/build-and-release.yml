name: Build and Release

permissions:
  contents: write

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 设置 JDK 26
        uses: actions/setup-java@v4
        with:
          java-version: '26'
          distribution: 'temurin'

      - name: 验证 Java 版本
        run: |
          echo "Java 版本:"
          java -version
          javac -version

      - name: 创建构建目录
        run: |
          mkdir -p build/classes
          mkdir -p build/lib

      - name: 复制依赖项到 build/lib
        run: |
          cp lib/*.jar build/lib/
          echo "复制依赖项:"
          ls -lh build/lib/

      - name: 构建 classpath
        run: |
          CLASSPATH=""
          for jar in lib/*.jar; do
            if [ -z "$CLASSPATH" ]; then
              CLASSPATH="$jar"
            else
              CLASSPATH="$CLASSPATH:$jar"
            fi
          done
          echo "CLASSPATH=$CLASSPATH" >> $GITHUB_ENV

      - name: 获取构建元信息
        id: get_version
        run: |
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            TAG=${GITHUB_REF#refs/tags/}
            APP_VERSION=${TAG#v}
          else
            TAG="dev-${GITHUB_SHA::7}"
            APP_VERSION="$TAG"
          fi
          VERSION="$TAG"
          CREATED_TIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "app_version=$APP_VERSION" >> $GITHUB_OUTPUT
          echo "created_time=$CREATED_TIME" >> $GITHUB_OUTPUT
          echo "TAG=$TAG" >> $GITHUB_ENV
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "APP_VERSION=$APP_VERSION" >> $GITHUB_ENV
          echo "CREATED_TIME=$CREATED_TIME" >> $GITHUB_ENV
          echo "构建 Tag: $TAG"
          echo "程序版本: $APP_VERSION"
          echo "构建时间: $CREATED_TIME"

      - name: 注入构建信息
        run: |
          python3 - << 'PY'
          import os
          from pathlib import Path
          path = Path("src/main/java/org/mark/llamacpp/server/BuildInfo.java")
          text = path.read_text(encoding="utf-8")
          replacements = {
              "{tag}": os.environ["TAG"],
              "{version}": os.environ["APP_VERSION"],
              "{createdTime}": os.environ["CREATED_TIME"],
          }
          for source, target in replacements.items():
              text = text.replace(source, target)
          path.write_text(text, encoding="utf-8")
          print(path.read_text(encoding="utf-8"))
          PY

      - name: 编译 Java 源码
        run: |
          find src/main/java -name "*.java" -print0 | xargs -0 javac \
            -source 21 \
            -target 21 \
            -encoding UTF-8 \
            -d build/classes \
            -cp "$CLASSPATH"

      - name: 复制 resources 到 classes 目录
        run: |
          if [ -d "src/main/resources" ]; then
            cp -r src/main/resources/* build/classes/
            echo "已复制 resources 到 classes 目录"
            echo "classes 目录内容:"
            ls -la build/classes/
          else
            echo "resources 目录不存在，跳过复制"
          fi

      - name: 验证编译结果
        run: |
          echo "编译输出文件:"
          find build/classes -type f | head -20
          echo "总文件数:"
          find build/classes -type f | wc -l

      - name: jlink 构建精简版 JRE (Linux)
        run: |
          JLINK_MODULES="java.base,java.compiler,java.desktop,java.naming,java.net.http,java.rmi,java.scripting,java.sql,jdk.management,jdk.sctp,jdk.unsupported,jdk.crypto.ec"
          mkdir -p jre-linux
          # Temurin 24+ 启用 JEP 493：本平台链接无需 jmods，直接从运行时镜像组装
          "$JAVA_HOME/bin/jlink" \
            --add-modules "$JLINK_MODULES" \
            --strip-debug --no-man-pages --no-header-files --compress=2 \
            --output jre-linux/jre
          # 生成默认 CDS 存档，降低启动内存
          jre-linux/jre/bin/java -Xshare:dump
          chmod +x jre-linux/jre/bin/java
          find jre-linux/jre -name jspawnhelper -exec chmod 755 {} \; 2>/dev/null || true
          # 校验产物平台（Linux 的 JVM 库在 lib/server/libjvm.so）
          if [ ! -f jre-linux/jre/lib/server/libjvm.so ]; then
            echo "ERROR: jre-linux/jre 不是 Linux 镜像（缺少 lib/server/libjvm.so）"
            exit 1
          fi
          jre-linux/jre/bin/java -version
          echo "Linux JRE jlink 构建完成"

      - name: jlink 构建精简版 JRE (Windows)
        run: |
          JLINK_MODULES="java.base,java.compiler,java.desktop,java.naming,java.net.http,java.rmi,java.scripting,java.sql,jdk.management,jdk.sctp,jdk.unsupported,jdk.crypto.ec"
          # Temurin 24+ 启用 JEP 493，JDK 压缩包不再包含 jmods 目录，
          # 跨平台链接必须单独下载目标平台的 jmods 作为模块源
          curl -L -o jmods-win.zip "https://api.adoptium.net/v3/binary/latest/26/ga/windows/x64/jmods/hotspot/normal/eclipse"
          mkdir -p jmods-win
          unzip -qo jmods-win.zip -d jmods-win
          # jmods 压缩包内是 jdk-<ver>-jmods/*.jmod，没有 jmods 子目录，按 java.base.jmod 定位
          WIN_JMODS=$(dirname "$(find jmods-win -name 'java.base.jmod' | head -1)")
          if [ -z "$WIN_JMODS" ] || ! ls "$WIN_JMODS"/*.jmod > /dev/null 2>&1; then
            echo "ERROR: 未找到有效的 Windows jmods: '$WIN_JMODS'"
            exit 1
          fi
          mkdir -p jre-win
          "$JAVA_HOME/bin/jlink" \
            --module-path "$WIN_JMODS" \
            --add-modules "$JLINK_MODULES" \
            --strip-debug --no-man-pages --no-header-files --compress=2 \
            --output jre-win/jre
          rm -rf jmods-win jmods-win.zip
          # 交叉链接在模块源无效时会静默回退为宿主平台镜像，必须显式校验产物
          if [ ! -f jre-win/jre/bin/server/jvm.dll ]; then
            echo "ERROR: jre-win/jre 不是 Windows 镜像（缺少 bin/server/jvm.dll）"
            exit 1
          fi
          ls jre-win/jre/bin/
          echo "Windows JRE jlink 构建完成"

      - name: 安装 MinGW-w64 交叉编译工具
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64

      - name: 编译启动器 (Linux)
        run: |
          cmake -S launcher -B launcher/build-linux -DCMAKE_BUILD_TYPE=Release \
            -DAPP_VERSION="${APP_VERSION}"
          cmake --build launcher/build-linux --config Release

      - name: 编译启动器 (Windows)
        run: |
          cmake -S launcher -B launcher/build-win \
            -DCMAKE_SYSTEM_NAME=Windows \
            -DCMAKE_C_COMPILER=x86_64-w64-mingw32-gcc \
            -DCMAKE_RC_COMPILER=x86_64-w64-mingw32-windres \
            -DAPP_VERSION="${APP_VERSION}"
          cmake --build launcher/build-win --config Release

      - name: 生成启动器配置
        run: |
          cat > launcher.conf.linux << 'EOF'
          ##MAINCLASS=org.mark.llamacpp.server.LlamaServer
          -Djava.class.path=./classes:./lib/gson-2.8.9.jar:./lib/netty-all-4.1.35.Final.jar:./lib/log4j-api-2.22.1.jar:./lib/log4j-core-2.22.1.jar:./lib/log4j-slf4j2-impl-2.22.1.jar:./lib/slf4j-api-2.0.9.jar
          -Xms96m
          -Xmx96m
          -XX:+UseSerialGC
          -XX:TieredStopAtLevel=1
          -XX:ReservedCodeCacheSize=48m
          -XX:MaxDirectMemorySize=128m
          EOF
          cat > launcher.conf.win << 'EOF'
          ##MAINCLASS=org.mark.llamacpp.server.LlamaServer
          -Djava.class.path=./classes;./lib/gson-2.8.9.jar;./lib/netty-all-4.1.35.Final.jar;./lib/log4j-api-2.22.1.jar;./lib/log4j-core-2.22.1.jar;./lib/log4j-slf4j2-impl-2.22.1.jar;./lib/slf4j-api-2.0.9.jar
          -Xms96m
          -Xmx96m
          -XX:+UseSerialGC
          -XX:TieredStopAtLevel=1
          -XX:ReservedCodeCacheSize=48m
          -XX:MaxDirectMemorySize=128m
          EOF

      - name: 定位并收集启动器产物
        run: |
          LINUX_BIN=$(find launcher/build-linux -name llama.cpp-hub -type f | head -1)
          WIN_BIN=$(find launcher/build-win -name llama.cpp-hub.exe -type f | head -1)
          cp "$LINUX_BIN" launcher/llama.cpp-hub
          cp "$WIN_BIN"   launcher/llama.cpp-hub.exe
          echo "Linux launcher: $LINUX_BIN -> launcher/llama.cpp-hub"
          echo "Windows launcher: $WIN_BIN -> launcher/llama.cpp-hub.exe"

      - name: 创建启动脚本 (Linux, 内置 JRE)
        run: |
          cat > build/run.sh << 'EOF'
          #!/bin/bash
          cd "$(dirname "$0")"
          chmod +x ./jre/bin/java
          find ./jre -name jspawnhelper -exec chmod 755 {} \; 2>/dev/null || true

          # ============================================================
          # JVM 内存参数说明 / JVM Memory Configuration
          # ============================================================
          # 本应用是轻量级 HTTP 服务器，默认分配 96MB 内存。
          # 模型由外部 llama.cpp 进程加载，不占用此 JVM 内存。
          # 通常不需要调整。仅在遇到 OutOfMemoryError 时才考虑增加。
          #
          # This is a lightweight HTTP server with 96MB default memory.
          # Models are loaded by external llama.cpp processes, not this JVM.
          # Normally no adjustment needed. Only increase if you encounter
          # OutOfMemoryError (e.g. many concurrent connections or large uploads).
          # ============================================================
          ./jre/bin/java -Xms96m -Xmx96m -XX:+UseSerialGC -XX:TieredStopAtLevel=1 -XX:ReservedCodeCacheSize=48m -XX:MaxDirectMemorySize=128m -classpath "./classes:./lib/*" org.mark.llamacpp.server.LlamaServer "$@"
          EOF
          chmod +x build/run.sh

      - name: 创建启动脚本 (Windows, 内置 JRE)
        run: |
          cat > build/run.bat << 'EOF'
          @echo off
          cd /d "%~dp0"

          rem ============================================================
          rem JVM 内存参数说明 / JVM Memory Configuration
          rem ============================================================
          rem 本应用是轻量级 HTTP 服务器，默认分配 96MB 内存。
          rem 模型由外部 llama.cpp 进程加载，不占用此 JVM 内存。
          rem 通常不需要调整。仅在遇到 OutOfMemoryError 时才考虑增加。
          rem
          rem This is a lightweight HTTP server with 96MB default memory.
          rem Models are loaded by external llama.cpp processes, not this JVM.
          rem Normally no adjustment needed. Only increase if you encounter
          rem OutOfMemoryError (e.g. many concurrent connections or large uploads).
          rem ============================================================
          start "" jre\bin\javaw.exe -Xms96m -Xmx96m -XX:+UseSerialGC -XX:TieredStopAtLevel=1 -XX:ReservedCodeCacheSize=48m -XX:MaxDirectMemorySize=128m -classpath "./classes;./lib/*" org.mark.llamacpp.server.LlamaServer %*
          EOF

      - name: 创建启动脚本 (平台无关, 使用系统 Java)
        run: |
          cp -r build build-standalone
          cat > build-standalone/run.sh << 'EOF'
          #!/bin/bash
          cd "$(dirname "$0")"

          # ============================================================
          # JVM 内存参数说明 / JVM Memory Configuration
          # ============================================================
          # Java 的内存管理机制与其他语言运行时不同：-Xmx 设定的最大堆内存
          # 是硬性上限，JVM 无法弹性突破。如果加载大模型时遇到
          # 本应用是轻量级 HTTP 服务器，默认分配 96MB 内存。
          # 模型由外部 llama.cpp 进程加载，不占用此 JVM 内存。
          # 通常不需要调整。仅在遇到 OutOfMemoryError 时才考虑增加。
          #
          # This is a lightweight HTTP server with 96MB default memory.
          # Models are loaded by external llama.cpp processes, not this JVM.
          # Normally no adjustment needed. Only increase if you encounter
          # OutOfMemoryError (e.g. many concurrent connections or large uploads).
          # ============================================================
          java -Xms96m -Xmx96m -XX:MaxDirectMemorySize=128m -classpath "./classes:./lib/*" org.mark.llamacpp.server.LlamaServer "$@"
          EOF
          chmod +x build-standalone/run.sh
          cat > build-standalone/run.bat << 'EOF'
          @echo off
          cd /d "%~dp0"

          rem ============================================================
          rem JVM 内存参数说明 / JVM Memory Configuration
          rem ============================================================
          rem 本应用是轻量级 HTTP 服务器，默认分配 96MB 内存。
          rem 模型由外部 llama.cpp 进程加载，不占用此 JVM 内存。
          rem 通常不需要调整。仅在遇到 OutOfMemoryError 时才考虑增加。
          rem
          rem This is a lightweight HTTP server with 96MB default memory.
          rem Models are loaded by external llama.cpp processes, not this JVM.
          rem Normally no adjustment needed. Only increase if you encounter
          rem OutOfMemoryError (e.g. many concurrent connections or large uploads).
          rem ============================================================
          start "" javaw.exe -Xms96m -Xmx96m -XX:MaxDirectMemorySize=128m -classpath "./classes;./lib/*" org.mark.llamacpp.server.LlamaServer %*
          EOF

      - name: 复制文档到 build 目录
        run: |
          if [ -f README.md ]; then
            cp README.md build/
            cp README.md build-standalone/
          fi
          if [ -d "docs" ]; then
            cp -r docs build/
            cp -r docs build-standalone/
            echo "已复制 docs 目录"
          fi

      - name: 获取 llama.cpp Releases 列表
        run: |
          curl -fsSL "https://api.github.com/repos/ggml-org/llama.cpp/releases?per_page=50" -o llama_releases.json

      - name: 下载 llama.cpp 预编译版本（自动降级）
        id: download_llamacpp
        run: |
          mkdir -p build/llamacpp
          TAGS=$(python3 - << 'PY'
          import json
          with open("llama_releases.json","r",encoding="utf-8") as f:
              releases = json.load(f)
          tags = [r.get("tag_name","") for r in releases if r.get("tag_name")]
          print(" ".join(tags))
          PY
          )
          if [ -z "$TAGS" ]; then
            echo "无法获取 llama.cpp releases 列表"
            exit 1
          fi
          flatten_one_level_dir() {
            local target_dir="$1"
            local inner_dir
            inner_dir=$(find "$target_dir" -maxdepth 1 -mindepth 1 -type d | head -1 || true)
            if [ -n "$inner_dir" ]; then
              shopt -s dotglob
              mv "$inner_dir"/* "$target_dir"/
              rmdir "$inner_dir" || true
              shopt -u dotglob
            fi
          }
          try_download() {
            local backend="$1"
            local asset_template="$2"
            local extract_kind="$3"
            local optional_extra_asset_template="$4"
            for tag in $TAGS; do
              local asset="${asset_template/\{tag\}/$tag}"
              local url="https://github.com/ggml-org/llama.cpp/releases/download/${tag}/${asset}"
              echo "[$backend] 尝试下载: $url"
              if curl -fL -o "$asset" "$url"; then
                local out_dir
                if [[ "$asset" == *.tar.gz ]]; then
                  out_dir="${asset%.tar.gz}"
                else
                  out_dir="${asset%.*}"
                fi
                mkdir -p "$out_dir"
                if [ "$extract_kind" = "zip" ]; then
                  unzip -qo "$asset" -d "$out_dir"
                else
                  tar -xzf "$asset" -C "$out_dir"
                fi
                rm -f "$asset"
                flatten_one_level_dir "$out_dir"
                if [ -n "$optional_extra_asset_template" ]; then
                  local extra_asset="${optional_extra_asset_template/\{tag\}/$tag}"
                  local extra_url="https://github.com/ggml-org/llama.cpp/releases/download/${tag}/${extra_asset}"
                  echo "[$backend] 尝试下载附加依赖: $extra_url"
                  if curl -fL -o "$extra_asset" "$extra_url"; then
                    local extra_out_dir="${extra_asset%.*}"
                    mkdir -p "$extra_out_dir"
                    unzip -qo "$extra_asset" -d "$extra_out_dir"
                    rm -f "$extra_asset"
                    flatten_one_level_dir "$extra_out_dir"
                    local extra_dir_var="${backend}_CUDART_DIR"
                    echo "${extra_dir_var}=$extra_out_dir" >> $GITHUB_ENV
                  fi
                fi
                echo "${backend}_TAG=$tag" >> $GITHUB_ENV
                echo "${backend}_AVAILABLE=1" >> $GITHUB_ENV
                echo "${backend}_DIR=$out_dir" >> $GITHUB_ENV
                echo "[$backend] 下载完成，使用 tag: $tag"
                return 0
              fi
              rm -f "$asset" || true
            done
            echo "${backend}_AVAILABLE=0" >> $GITHUB_ENV
            echo "[$backend] 未找到可下载的版本，已跳过"
            return 0
          }
          try_download "WIN_CUDA12" "llama-{tag}-bin-win-cuda-12.4-x64.zip" "zip" "cudart-llama-bin-win-cuda-12.4-x64.zip"
          try_download "WIN_CUDA13" "llama-{tag}-bin-win-cuda-13.3-x64.zip" "zip" "cudart-llama-bin-win-cuda-13.3-x64.zip"
          try_download "WIN_VULKAN" "llama-{tag}-bin-win-vulkan-x64.zip" "zip" ""
          try_download "WIN_HIP" "llama-{tag}-bin-win-hip-radeon-x64.zip" "zip" ""
          try_download "UBUNTU_VULKAN" "llama-{tag}-bin-ubuntu-vulkan-x64.tar.gz" "tar" ""
          try_download "UBUNTU_ROCM72" "llama-{tag}-bin-ubuntu-rocm-7.2-x64.tar.gz" "tar" ""

      - name: 打包（按实际下载到的后端动态生成）
        id: package
        run: |
          mkdir -p dist
          make_zip() {
            local work_dir="$1"
            local root_name="$2"
            local zip_name="$3"
            mv "$work_dir" "$root_name"
            zip -r -9 -X "dist/$zip_name" "$root_name"
          }
          cp -r build-standalone build-pkg
          mkdir -p build-pkg/llamacpp
          make_zip "build-pkg" "llama.cpp-hub-${VERSION}" "llama.cpp-hub-${VERSION}.zip"
          cp -r build build-linux-no-llamacpp
          rm -rf build-linux-no-llamacpp/classes/tools/easy-tools/windows
          cp -r jre-linux/jre build-linux-no-llamacpp/jre
          mkdir -p build-linux-no-llamacpp/llamacpp
          cp launcher/llama.cpp-hub build-linux-no-llamacpp/
          cp launcher.conf.linux build-linux-no-llamacpp/launcher.conf
          chmod +x build-linux-no-llamacpp/llama.cpp-hub
          make_zip "build-linux-no-llamacpp" "llama.cpp-hub-${VERSION}-linux" "llama.cpp-hub-${VERSION}-linux.zip"
          cp -r build build-win-no-llamacpp
          rm -rf build-win-no-llamacpp/classes/tools/easy-tools/linux
          cp -r jre-win/jre build-win-no-llamacpp/jre
          mkdir -p build-win-no-llamacpp/llamacpp
          cp launcher/llama.cpp-hub.exe build-win-no-llamacpp/
          cp launcher.conf.win build-win-no-llamacpp/launcher.conf
          make_zip "build-win-no-llamacpp" "llama.cpp-hub-${VERSION}-windows" "llama.cpp-hub-${VERSION}-windows.zip"
          if [ "${UBUNTU_VULKAN_AVAILABLE:-0}" = "1" ]; then
            cp -r build build-linux-vulkan
            rm -rf build-linux-vulkan/classes/tools/easy-tools/windows
            cp -r jre-linux/jre build-linux-vulkan/jre
            mkdir -p build-linux-vulkan/llamacpp
            cp -r "${UBUNTU_VULKAN_DIR}" build-linux-vulkan/llamacpp/
            cp launcher/llama.cpp-hub build-linux-vulkan/
            cp launcher.conf.linux build-linux-vulkan/launcher.conf
            chmod +x build-linux-vulkan/llama.cpp-hub
            make_zip "build-linux-vulkan" "llama.cpp-hub-${VERSION}-${UBUNTU_VULKAN_TAG}-linux-vulkan" "llama.cpp-hub-${VERSION}-${UBUNTU_VULKAN_TAG}-linux-vulkan.zip"
          fi
          if [ "${UBUNTU_ROCM72_AVAILABLE:-0}" = "1" ]; then
            cp -r build build-linux-rocm72
            rm -rf build-linux-rocm72/classes/tools/easy-tools/windows
            cp -r jre-linux/jre build-linux-rocm72/jre
            mkdir -p build-linux-rocm72/llamacpp
            cp -r "${UBUNTU_ROCM72_DIR}" build-linux-rocm72/llamacpp/
            cp launcher/llama.cpp-hub build-linux-rocm72/
            cp launcher.conf.linux build-linux-rocm72/launcher.conf
            chmod +x build-linux-rocm72/llama.cpp-hub
            make_zip "build-linux-rocm72" "llama.cpp-hub-${VERSION}-${UBUNTU_ROCM72_TAG}-linux-rocm-7.2" "llama.cpp-hub-${VERSION}-${UBUNTU_ROCM72_TAG}-linux-rocm-7.2.zip"
          fi
          if [ "${WIN_CUDA12_AVAILABLE:-0}" = "1" ]; then
            cp -r build build-win-cuda12
            rm -rf build-win-cuda12/classes/tools/easy-tools/linux
            cp -r jre-win/jre build-win-cuda12/jre
            mkdir -p build-win-cuda12/llamacpp
            cp -r "${WIN_CUDA12_DIR}" build-win-cuda12/llamacpp/
            if [ -n "${WIN_CUDA12_CUDART_DIR:-}" ]; then
              cp -r "${WIN_CUDA12_CUDART_DIR}" build-win-cuda12/llamacpp/
            fi
            cp launcher/llama.cpp-hub.exe build-win-cuda12/
            cp launcher.conf.win build-win-cuda12/launcher.conf
            make_zip "build-win-cuda12" "llama.cpp-hub-${VERSION}-${WIN_CUDA12_TAG}-windows-cuda12" "llama.cpp-hub-${VERSION}-${WIN_CUDA12_TAG}-windows-cuda12.zip"
          fi
          if [ "${WIN_CUDA13_AVAILABLE:-0}" = "1" ]; then
            cp -r build build-win-cuda13
            rm -rf build-win-cuda13/classes/tools/easy-tools/linux
            cp -r jre-win/jre build-win-cuda13/jre
            mkdir -p build-win-cuda13/llamacpp
            cp -r "${WIN_CUDA13_DIR}" build-win-cuda13/llamacpp/
            if [ -n "${WIN_CUDA13_CUDART_DIR:-}" ]; then
              cp -r "${WIN_CUDA13_CUDART_DIR}" build-win-cuda13/llamacpp/
            fi
            cp launcher/llama.cpp-hub.exe build-win-cuda13/
            cp launcher.conf.win build-win-cuda13/launcher.conf
            make_zip "build-win-cuda13" "llama.cpp-hub-${VERSION}-${WIN_CUDA13_TAG}-windows-cuda13" "llama.cpp-hub-${VERSION}-${WIN_CUDA13_TAG}-windows-cuda13.zip"
          fi
          if [ "${WIN_VULKAN_AVAILABLE:-0}" = "1" ]; then
            cp -r build build-win-vulkan
            rm -rf build-win-vulkan/classes/tools/easy-tools/linux
            cp -r jre-win/jre build-win-vulkan/jre
            mkdir -p build-win-vulkan/llamacpp
            cp -r "${WIN_VULKAN_DIR}" build-win-vulkan/llamacpp/
            cp launcher/llama.cpp-hub.exe build-win-vulkan/
            cp launcher.conf.win build-win-vulkan/launcher.conf
            make_zip "build-win-vulkan" "llama.cpp-hub-${VERSION}-${WIN_VULKAN_TAG}-windows-vulkan" "llama.cpp-hub-${VERSION}-${WIN_VULKAN_TAG}-windows-vulkan.zip"
          fi
          if [ "${WIN_HIP_AVAILABLE:-0}" = "1" ]; then
            cp -r build build-win-hip
            rm -rf build-win-hip/classes/tools/easy-tools/linux
            cp -r jre-win/jre build-win-hip/jre
            mkdir -p build-win-hip/llamacpp
            cp -r "${WIN_HIP_DIR}" build-win-hip/llamacpp/
            cp launcher/llama.cpp-hub.exe build-win-hip/
            cp launcher.conf.win build-win-hip/launcher.conf
            make_zip "build-win-hip" "llama.cpp-hub-${VERSION}-${WIN_HIP_TAG}-windows-hip" "llama.cpp-hub-${VERSION}-${WIN_HIP_TAG}-windows-hip.zip"
          fi

      - name: 生成 Release Notes
        id: release_notes
        run: |
          # 获取最新的 commit 信息
          LATEST_COMMIT=$(git log -1 --pretty=format:"%h - %s (%an, %ar)")
          COMMIT_MESSAGE=$(git log -1 --pretty=format:"%B")

          # 获取自上一个 tag 以来的所有 commit
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            COMMITS_SINCE_TAG=$(git log ${PREV_TAG}..HEAD --pretty=format:"- %s (%h)" --no-merges)
          else
            COMMITS_SINCE_TAG=$(git log --pretty=format:"- %s (%h)" --no-merges | head -20)
          fi

          LINUX_ZIPS=$(ls dist/*linux*.zip 2>/dev/null || true)
          WINDOWS_ZIPS=$(ls dist/*windows*.zip 2>/dev/null || true)
          BASE_ZIP="dist/llama.cpp-hub-${VERSION}.zip"
          cat > release_notes.md << 'EOF'
          ## 🚀 Release Notes

           > ⚠️ **重要提示**：重要数据请不要留在 Easy Chat 中；更新前请备份 `cache/` 目录，重点关注 `easy-chat` 目录。如果是老版本的 JSON 格式聊天记录，还可以在里面找到；bin 文件则无法直接查看，请务必不要将重要数据放在 Easy Chat 中。万一真的丢失了重要数据，可以联系我帮忙找回，或者自行使用 AI 工具，了解 bin 文件结构，找回内容。所以记得备份！
           >
           > ⚠️ **IMPORTANT**: Do not store important data in Easy Chat. Please back up the entire `cache/` directory before upgrading, especially the `easy-chat/` subdirectory. Old JSON-format chat records can still be viewed, but `.bin` files are not human-readable. If you lose important data, contact me for help, or use AI tools to understand the `.bin` file structure and recover the content. Backup now!

           ### 📦 基础版本
          - 仅包含编译后的 class 文件和依赖库，不包含 JRE 和 llama.cpp
          - 需要系统已安装 Java 21+ 运行环境
          - 平台无关，Linux/Windows 通用

          ### 📦 完整版本（内置 JRE）
          - 编译后的 class 文件
          - 所有依赖库（lib/*.jar）
          - 精简版 JRE 26（jlink 定制的 HotSpot 运行时，内置，无需额外安装 Java 运行环境）
          - 启动脚本（run.sh / run.bat）

          ### 🧩 llama.cpp 版本
          - 本项目中打包的 llamacpp 二进制来自 llama.cpp 项目的 Release（最新版本发布页：https://github.com/ggml-org/llama.cpp/releases/latest）
          EOF
          ANY_BACKEND=0
          if [ "${UBUNTU_VULKAN_AVAILABLE:-0}" = "1" ]; then
            echo "- Linux Vulkan: ${UBUNTU_VULKAN_TAG}" >> release_notes.md
            ANY_BACKEND=1
          fi
          if [ "${UBUNTU_ROCM72_AVAILABLE:-0}" = "1" ]; then
            echo "- Linux ROCm 7.2: ${UBUNTU_ROCM72_TAG}" >> release_notes.md
            ANY_BACKEND=1
          fi
          if [ "${WIN_CUDA12_AVAILABLE:-0}" = "1" ]; then
            echo "- Windows CUDA12: ${WIN_CUDA12_TAG}" >> release_notes.md
            ANY_BACKEND=1
          fi
          if [ "${WIN_CUDA13_AVAILABLE:-0}" = "1" ]; then
            echo "- Windows CUDA13: ${WIN_CUDA13_TAG}" >> release_notes.md
            ANY_BACKEND=1
          fi
          if [ "${WIN_VULKAN_AVAILABLE:-0}" = "1" ]; then
            echo "- Windows Vulkan: ${WIN_VULKAN_TAG}" >> release_notes.md
            ANY_BACKEND=1
          fi
          if [ "${WIN_HIP_AVAILABLE:-0}" = "1" ]; then
            echo "- Windows HIP: ${WIN_HIP_TAG}" >> release_notes.md
            ANY_BACKEND=1
          fi
          if [ "$ANY_BACKEND" = "0" ]; then
            echo "- 无" >> release_notes.md
          fi
          echo "" >> release_notes.md
          echo "### 📦 可用版本" >> release_notes.md
          echo "" >> release_notes.md
          echo "**平台无关（需系统 Java 21+）:**" >> release_notes.md
          if [ -f "$BASE_ZIP" ]; then
            echo "- \`llama.cpp-hub-${VERSION}.zip\`" >> release_notes.md
          else
            echo "- 无" >> release_notes.md
          fi
          echo "" >> release_notes.md
          echo "**Linux:**" >> release_notes.md
          if [ -n "$LINUX_ZIPS" ]; then
            while IFS= read -r f; do
              [ -n "$f" ] && echo "- \`$(basename "$f")\`" >> release_notes.md
            done <<< "$LINUX_ZIPS"
          else
            echo "- 无" >> release_notes.md
          fi
          echo "" >> release_notes.md
          echo "**Windows:**" >> release_notes.md
          if [ -n "$WINDOWS_ZIPS" ]; then
            while IFS= read -r f; do
              [ -n "$f" ] && echo "- \`$(basename "$f")\`" >> release_notes.md
            done <<< "$WINDOWS_ZIPS"
          else
            echo "- 无" >> release_notes.md
          fi
          cat >> release_notes.md << 'EOF'

          ### 📝 使用方法

          **Linux:**
          ```bash
          unzip <你下载的 linux zip 包>
          cd <解压后的目录>
          chmod +x run.sh
          chmod +x jre/bin/java
          ./run.sh
          ```

          **Windows:**
          ```cmd
          unzip <你下载的 windows zip 包>
          cd <解压后的目录>
          run.bat
          ```

          **注意：**
          - **升级前请先备份 `cache/` 目录**。
          - **Back up the `cache/` directory before upgrading.**
          - 本版本已内置精简版 JRE，无需额外安装 Java 环境。
          - Windows CUDA 版本文件较大，是因为使用了 `cudart` 包，包含了 CUDA 运行环境。
          - 请根据你的 GPU 选择对应的版本：
            - NVIDIA GPU: 使用 cuda12 或 cuda13 版本
            - AMD GPU: 使用 hip 版本，Linux系统，AI MAX+ 395（或其它ROCm7.2支持的GPU）可以使用ROCm7.2版本
            - 其他 GPU（如核显） 或不确定: 使用 vulkan 版本
            - 不需要llamacpp：使用无 llamacpp 版本
          - **安全警告：** 本应用为局域网工具，不具备互联网安全防护能力。请勿将服务端口直接暴露到公网。如需远程访问，请使用反向代理 + HTTPS。详细安全声明见 README。

          ### ⚠️ JVM 内存配置 / JVM Memory Configuration

          本应用是轻量级 HTTP 服务器，默认分配 96MB 内存。
          模型由外部 llama.cpp 进程加载，不占用此 JVM 内存。

          This is a lightweight HTTP server with 96MB default memory.
          Models are loaded by external llama.cpp processes, not this JVM.

          > 💡 **作者的话 / Author's Note**: 我不想浪费兄弟们的内存，就设置个 96MB 又不是不能用！
          > 真出问题了再改大，然后告诉我是怎么不够用的吧！
          > I don't want to waste everyone's memory - 96MB works just fine!
          > If you really run into issues, increase it and let me know what went wrong!
          ---
          ### 📌 最新提交
          EOF

          echo "$LATEST_COMMIT" >> release_notes.md
          echo "" >> release_notes.md

          # 添加提交详情
          if [ -n "$COMMITS_SINCE_TAG" ]; then
            echo "### 📋 自上次发布以来的变更" >> release_notes.md
            echo "" >> release_notes.md
            echo "$COMMITS_SINCE_TAG" >> release_notes.md
          fi

          echo "" >> release_notes.md
          echo "---" >> release_notes.md
          echo "*构建时间: $(date -u +"%Y-%m-%d %H:%M:%S UTC")*" >> release_notes.md

          # 输出内容供调试
          echo "生成的 Release Notes:"
          cat release_notes.md

      - name: 创建 Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: dist/*.zip
          body_path: release_notes.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: llama.cpp-hub-${{ steps.get_version.outputs.version }}
          path: |
            dist/*.zip
            release_notes.md
          retention-days: 30
